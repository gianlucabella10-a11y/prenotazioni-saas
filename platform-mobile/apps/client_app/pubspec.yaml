name: client_app
description: "White label booking client app — one codebase, every tenant. The build pipeline injects tenant identity via --dart-define (docs/27)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (docs/23 §5: explicit states, DI via providers).
  flutter_riverpod: ^3.2.0

  # Routing with auth/config-aware redirects.
  go_router: ^17.2.5

  # Networking with interceptors (JWT refresh single-flight).
  dio: ^5.9.1

  # Token persistence in Keychain/Keystore (docs/26 §3).
  flutter_secure_storage: ^10.3.1

  # White label config cache (offline-safe ETag revalidation).
  shared_preferences: ^2.5.4

  # Locale-aware date formatting (slot times, appointment cards).
  intl: any

  # Idempotency keys for booking submissions (docs/25 §6).
  uuid: ^4.5.2

  # Legal links (privacy/terms/support) opened in the system browser.
  url_launcher: ^6.3.1
  sentry_flutter: ^9.22.0   # 9.x: compatibilità con Xcode 26 (la 8.x non compila)

  # Push notifications (Fase 4). L'inizializzazione è guardata: senza i file
  # di configurazione Firebase (vedi FIREBASE_CONFIGURATION_REQUIRED.md) il
  # push resta disattivato e l'app pienamente funzionante.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # App Factory FASE 2B — generano icone/splash nativi dal logo del tenant.
  # Eseguiti dallo script tool/app_factory/make_app.sh a build-time (non al
  # boot dell'app): consumano tool/app_factory/build/{icon,splash}.png.
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
