# App Factory FASE 2B — generazione icone native dal logo del tenant.
# La sorgente (tool/app_factory/build/icon.png) è popolata da make_app.sh con
# l'icona 1024 generata dall'Asset Factory. Eseguito a build-time:
#   dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "tool/app_factory/build/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "tool/app_factory/build/icon.png"
